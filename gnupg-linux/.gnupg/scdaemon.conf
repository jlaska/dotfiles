# Talk to the YubiKey through pcscd (instead of scdaemon's internal CCID driver)
# and share it, so ykman and gpg can use the card at the same time.
disable-ccid
pcsc-shared
# The YubiKey also has a PIV applet. scdaemon scans it (e.g. for SSH's KEYINFO --list=auth),
# and switching applets drops the OpenPGP PIN verification, so every SSH auth re-prompts.
disable-application piv
