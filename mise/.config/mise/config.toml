# Global mise config (~/.config/mise/config.toml). Install with `make install-mise`.
# mise owns language runtimes and Kubernetes/lint CLIs; Homebrew keeps bootstrap
# tools (gh, jq, yq, sops, age, gitleaks, pre-commit) plus go and uv, which the
# Brewfile's `go`/`uv` entries depend on.

[tools]
node = "24.22.1"
python = "3.13.16"

argocd = "3.5.6"
cilium-cli = "0.20.1"
cilium-hubble = "1.20.2"
crane = "0.22.1"
helm = "4.3.1"
k9s = "0.51.0"
kube-linter = "0.8.3"
kubeconform = "0.8.0"
kubectl = "1.36.5"
kubectx = "0.11.0"
kubeseal = "0.40.0"
kustomize = "5.8.3"
shellcheck = "0.11.0"
stern = "1.34.0"
talosctl = "1.14.4"
yamllint = "1.38.0"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.1"
