keymap:
  # GNOME shell shortcuts, in every app. Listed first so they win over
  # the per-app Super-KEY_N rules, which would otherwise turn
  # Shift-Super-N into Alt-Shift-N.
  - name: GNOME shell passthrough
    remap:
      # Screenshots (GNOME binds Shift-Super-3/4/5 like macOS)
      Super-Shift-KEY_3: Super-Shift-KEY_3
      Super-Shift-KEY_4: Super-Shift-KEY_4
      Super-Shift-KEY_5: Super-Shift-KEY_5

  # GNOME terminals: Command controls terminal UI;
  # physical Control remains untouched for the shell.
  - name: macOS Terminal
    application:
      only:
        - org.gnome.Ptyxis
        - org.gnome.Terminal
        - org.gnome.Console
    remap:
      Super-C: Ctrl-Shift-C
      Super-V: Ctrl-Shift-V
      Super-T: Ctrl-Shift-T
      Super-W: Ctrl-Shift-W
      Super-N: Ctrl-Shift-N
      Super-F: Ctrl-Shift-F
      # Switch tabs (macOS Cmd-Shift-] / Cmd-Shift-[)
      Super-Shift-RightBrace: Ctrl-PageDown
      Super-Shift-LeftBrace: Ctrl-PageUp
      # Select tab N (macOS Cmd-1..9); Ptyxis/GNOME Terminal use Alt-N
      Super-KEY_1: Alt-KEY_1
      Super-KEY_2: Alt-KEY_2
      Super-KEY_3: Alt-KEY_3
      Super-KEY_4: Alt-KEY_4
      Super-KEY_5: Alt-KEY_5
      Super-KEY_6: Alt-KEY_6
      Super-KEY_7: Alt-KEY_7
      Super-KEY_8: Alt-KEY_8
      Super-KEY_9: Alt-KEY_9
      Super-KEY_0: Alt-KEY_0
      # Line navigation and editing for the zsh line editor
      Super-Left: Home
      Super-Right: End
      Super-Backspace: Ctrl-U
      # Option-Left/Right word movement (oh-my-zsh binds Ctrl-Left/Right)
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right

  # Regular desktop applications
  - name: macOS GUI shortcuts
    application:
      not:
        - org.gnome.Ptyxis
        - org.gnome.Terminal
        - org.gnome.Console
    remap:
      # Combos with extra modifiers come first so they win over the
      # inexact matches below (e.g. Super-Q would turn Ctrl-Super-Q into Ctrl-Q).
      # Lock screen (macOS Ctrl-Cmd-Q); Super-L is GNOME's lock shortcut
      Ctrl-Super-Q: Super-L
      # Toggle fullscreen (macOS Ctrl-Cmd-F)
      Ctrl-Super-F: F11
      # Line / document navigation; Shift-select works via inexact match
      Super-Left: Home
      Super-Right: End
      Super-Up: Ctrl-Home
      Super-Down: Ctrl-End
      Super-Backspace: [Shift-Home, Backspace]
      # Option = word movement and deletion
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right
      Alt-Backspace: Ctrl-Backspace
      # Back/Forward (macOS Cmd-[ / Cmd-]), since Alt-Left is now word-left
      Super-LeftBrace: Alt-Left
      Super-RightBrace: Alt-Right
      # Minimize (macOS Cmd-M); Super-H is GNOME's minimize shortcut
      Super-M: Super-H
      Super-C: Ctrl-C
      Super-V: Ctrl-V
      Super-X: Ctrl-X
      Super-Z: Ctrl-Z
      Super-A: Ctrl-A
      Super-S: Ctrl-S
      Super-F: Ctrl-F
      Super-L: Ctrl-L
      Super-T: Ctrl-T
      Super-W: Ctrl-W
      Super-N: Ctrl-N
      Super-R: Ctrl-R
      Super-P: Ctrl-P
      Super-Q: Ctrl-Q
      Super-O: Ctrl-O
      Super-G: Ctrl-G
      Super-D: Ctrl-D
      Super-B: Ctrl-B
      Super-I: Ctrl-I
      Super-U: Ctrl-U
      Super-K: Ctrl-K
      Super-Comma: Ctrl-Comma
      # Zoom in/out (Cmd-0 reset is below)
      Super-Equal: Ctrl-Equal
      Super-Minus: Ctrl-Minus
      # Switch tabs (macOS Cmd-Shift-] / Cmd-Shift-[)
      Super-Shift-RightBrace: Ctrl-PageDown
      Super-Shift-LeftBrace: Ctrl-PageUp
      # Select tab N (macOS Cmd-1..9; Cmd-9 = last tab in browsers).
      # Intercepted here, so GNOME's Super-N app launcher never fires.
      # Alt-N, not Ctrl-N: Linux Firefox only accepts Alt-N for tabs,
      # while Chromium-based browsers accept both.
      Super-KEY_1: Alt-KEY_1
      Super-KEY_2: Alt-KEY_2
      Super-KEY_3: Alt-KEY_3
      Super-KEY_4: Alt-KEY_4
      Super-KEY_5: Alt-KEY_5
      Super-KEY_6: Alt-KEY_6
      Super-KEY_7: Alt-KEY_7
      Super-KEY_8: Alt-KEY_8
      Super-KEY_9: Alt-KEY_9
      # Cmd-0 on macOS resets zoom
      Super-KEY_0: Ctrl-KEY_0
